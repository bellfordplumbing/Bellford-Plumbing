<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bellford Plumbing — licensed plumbing service in Houston and Greater Houston. Emergency plumbing, leak detection, drain cleaning, water heaters, and more. Call (346) 451-2076."
    />
    <title>Bellford Plumbing | Licensed Plumbers in Houston, TX</title>
    <link rel="preload" href="/fonts/montserrat.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/open-sans.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function () {
        var home = location.pathname === '/' || location.pathname === '/index.html'
        var link = document.createElement('link')
        link.rel = 'preload'
        link.as = 'image'
        link.fetchPriority = 'high'
        link.imageSizes = '100vw'
        if (home) {
          link.href = '/images/hero-fleet-sm.webp'
          link.imageSrcset = '/images/hero-fleet-sm.webp 768w, /images/hero-fleet.webp 1400w'
        } else {
          link.href = '/images/cta-vans-sm.webp'
          link.imageSrcset = '/images/cta-vans-sm.webp 768w, /images/cta-vans.webp 1400w'
        }
        document.head.appendChild(link)
      })()
    </script>
  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="first" />
      <input name="last" />
      <input name="phone" />
      <input name="email" />
      <input name="service" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
