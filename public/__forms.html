<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bellford Plumbing forms</title>
  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="first" />
      <input name="last" />
      <input name="phone" />
      <input name="email" />
      <input name="service" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
